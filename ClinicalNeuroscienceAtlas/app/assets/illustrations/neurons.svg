    <linearGradient id="axon" x1="0" x2="1"><stop stop-color="#50f1d2"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
    <linearGradient id="myelin" x1="0" x2="1"><stop stop-color="#294c70"/><stop offset=".5" stop-color="#5caef4"/><stop offset="1" stop-color="#24466a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

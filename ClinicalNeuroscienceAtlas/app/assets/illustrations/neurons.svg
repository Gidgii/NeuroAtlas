<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Multipolar neuron anatomy</title><desc id="desc">A premium anatomical illustration showing a multipolar neuron with branching dendrites, soma, nucleus, axon hillock, myelinated axon, nodes of Ranvier and synaptic terminals.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Amygdala</title><desc id="desc">Stylised medical atlas illustration of the Amygdala with five labelled components.</desc><rect width="900" height="560" rx="36" fill="#090d12"/><path d="M110 300 C150 120 330 70 480 115 C650 85 790 190 780 330 C770 455 625 500 480 470 C315 515 135 445 110 300Z" fill="#111a23" stroke="#73e6ff" stroke-width="5"/><circle cx="250" cy="210" r="48" fill="#73e6ff" opacity="0.88"/><circle cx="250" cy="210" r="58" fill="none" stroke="#73e6ff" stroke-width="3" stroke-dasharray="8 8"/><text x="250" y="215" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#071018">1</text><text x="250" y="292" text-anchor="middle" font-family="Arial" font-size="18" fill="#f5fbff">Lateral nucleus</text><circle cx="430" cy="165" r="48" fill="#ff74d4" opacity="0.88"/><circle cx="430" cy="165" r="58" fill="none" stroke="#ff74d4" stroke-width="3" stroke-dasharray="8 8"/><text x="430" y="170" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#071018">2</text><text x="430" y="247" text-anchor="middle" font-family="Arial" font-size="18" fill="#f5fbff">Basal nuclei</text><circle cx="610" cy="225" r="48" fill="#ffd166" opacity="0.88"/><circle cx="610" cy="225" r="58" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="8 8"/><text x="610" y="230" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#071018">3</text><text x="610" y="307" text-anchor="middle" font-family="Arial" font-size="18" fill="#f5fbff">Central nucleus</text><circle cx="560" cy="370" r="48" fill="#8df58a" opacity="0.88"/><circle cx="560" cy="370" r="58" fill="none" stroke="#8df58a" stroke-width="3" stroke-dasharray="8 8"/><text x="560" y="375" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#071018">4</text><text x="560" y="452" text-anchor="middle" font-family="Arial" font-size="18" fill="#f5fbff">Intercalated cells</text><circle cx="330" cy="385" r="48" fill="#b9a0ff" opacity="0.88"/><circle cx="330" cy="385" r="58" fill="none" stroke="#b9a0ff" stroke-width="3" stroke-dasharray="8 8"/><text x="330" y="390" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#071018">5</text><text x="330" y="467" text-anchor="middle" font-family="Arial" font-size="18" fill="#f5fbff">Extended amygdala</text><text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#f5fbff">Amygdala</text></svg>
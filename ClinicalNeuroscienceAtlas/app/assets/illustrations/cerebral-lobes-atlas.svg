<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Cerebral Lobes Atlas</title><desc id="desc">Interactive chalkboard-style anatomical atlas of Cerebral Lobes with labelled regions and pathway relationships.</desc><style>.bg{fill:#090b0d}.outline{fill:#171d24;stroke:#e8f0f4;stroke-width:5}.label{fill:#f5f7f8;font:600 22px Arial}.dot{fill:#48e5c2}.frontal{fill:#ff8a65;opacity:.88}.parietal{fill:#ffd166;opacity:.88}.temporal{fill:#5cc8ff;opacity:.88}.occipital{fill:#b78cff;opacity:.9}.insula{fill:#48e5c2;stroke:#fff;stroke-width:3}.folia path{fill:none;stroke:#5cc8ff;stroke-width:10;stroke-linecap:round}.vermis{fill:#ff8a65;opacity:.8;stroke:#fff;stroke-width:3}.midbrain{fill:#ffd166}.pons{fill:#5cc8ff}.medulla{fill:#ff8a65}.tract{fill:none;stroke:#48e5c2;stroke-width:7;stroke-dasharray:12 8}</style><rect class="bg" width="760" height="480" rx="28"/><text x="40" y="55" class="label">Cerebral Lobes Atlas</text><path class="outline" d="M320 98 C210 95 155 170 162 270 C168 354 250 405 365 391 C480 377 545 312 525 205 C508 118 418 91 320 98Z"/><path class="frontal" d="M163 268 C158 175 214 108 305 100 L309 275Z"/><path class="parietal" d="M305 100 C385 91 458 116 500 175 L390 265 L309 275Z"/><path class="temporal" d="M309 275 L390 265 L465 330 C420 374 355 396 285 388Z"/><path class="occipital" d="M500 175 C540 231 532 292 465 330 L390 265Z"/><path class="insula" d="M326 212 C355 194 392 200 410 227 C393 252 356 262 328 246Z"/><text x="52" y="140" class="label">Frontal lobe</text><circle cx="30" cy="134" r="7" class="dot"/><text x="52" y="185" class="label">Parietal lobe</text><circle cx="30" cy="179" r="7" class="dot"/><text x="52" y="230" class="label">Temporal lobe</text><circle cx="30" cy="224" r="7" class="dot"/><text x="52" y="275" class="label">Occipital lobe</text><circle cx="30" cy="269" r="7" class="dot"/><text x="52" y="320" class="label">Insula</text><circle cx="30" cy="314" r="7" class="dot"/></svg>
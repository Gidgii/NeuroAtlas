<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Cerebellum Atlas</title><desc id="desc">Interactive chalkboard-style anatomical atlas of Cerebellum with labelled regions and pathway relationships.</desc><style>.bg{fill:#090b0d}.outline{fill:#171d24;stroke:#e8f0f4;stroke-width:5}.label{fill:#f5f7f8;font:600 22px Arial}.dot{fill:#48e5c2}.frontal{fill:#ff8a65;opacity:.88}.parietal{fill:#ffd166;opacity:.88}.temporal{fill:#5cc8ff;opacity:.88}.occipital{fill:#b78cff;opacity:.9}.insula{fill:#48e5c2;stroke:#fff;stroke-width:3}.folia path{fill:none;stroke:#5cc8ff;stroke-width:10;stroke-linecap:round}.vermis{fill:#ff8a65;opacity:.8;stroke:#fff;stroke-width:3}.midbrain{fill:#ffd166}.pons{fill:#5cc8ff}.medulla{fill:#ff8a65}.tract{fill:none;stroke:#48e5c2;stroke-width:7;stroke-dasharray:12 8}</style><rect class="bg" width="760" height="480" rx="28"/><text x="40" y="55" class="label">Cerebellum Atlas</text><path class="outline" d="M250 120 C180 145 145 225 178 304 C214 388 362 412 472 340 C548 290 530 184 450 136 C390 100 307 99 250 120Z"/><g class="folia"><path d="M205 180 Q330 115 475 185"/><path d="M184 220 Q330 150 505 220"/><path d="M180 260 Q330 190 512 260"/><path d="M190 300 Q330 230 495 302"/><path d="M220 340 Q330 278 458 338"/></g><path class="vermis" d="M330 120 C300 175 298 300 335 380 C370 301 372 180 330 120Z"/><text x="52" y="140" class="label">Vermis</text><circle cx="30" cy="134" r="7" class="dot"/><text x="52" y="185" class="label">Lateral hemispheres</text><circle cx="30" cy="179" r="7" class="dot"/><text x="52" y="230" class="label">Flocculonodular lobe</text><circle cx="30" cy="224" r="7" class="dot"/><text x="52" y="275" class="label">Deep nuclei</text><circle cx="30" cy="269" r="7" class="dot"/><text x="52" y="320" class="label">Cerebellar peduncles</text><circle cx="30" cy="314" r="7" class="dot"/></svg>
<path d="M150 280 C240 130 340 130 420 280 S600 430 750 280" opacity=".8"/>
<circle cx="150" cy="280" r="62"/><circle cx="350" cy="190" r="62"/><circle cx="550" cy="370" r="62"/><circle cx="750" cy="280" r="62"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Healthy Versus Pathology Comparison</title>
  <desc id="desc">Two overlapping neon-chalk brain network maps compare healthy variation with structural, functional, developmental, vascular and degenerative patterns. A bridge labelled clinical context joins them.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#173033"/><stop offset="1" stop-color="#070b0d"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1" fill="#dff8f2" opacity=".08"/></pattern></defs>
  <rect width="1200" height="750" rx="32" fill="url(#bg)"/><rect width="1200" height="750" rx="32" fill="url(#p)"/>
  <text x="600" y="62" text-anchor="middle" fill="#eef8f6" font-family="system-ui,sans-serif" font-size="34" font-weight="700">VARIATION · PATTERN · CONTEXT · UNCERTAINTY</text>
  <g fill="#102326" stroke-width="7" filter="url(#g)"><path d="M506 145C383 87 202 144 158 290c-44 144 44 298 188 334 80 20 173-9 207-83V236c-3-43-18-72-47-91Z" stroke="#50f1d2"/><path d="M694 145c123-58 304-1 348 145 44 144-44 298-188 334-80 20-173-9-207-83V236c3-43 18-72 47-91Z" stroke="#ff668f"/></g>
  <g fill="none" stroke-linecap="round"><g stroke="#50f1d2" stroke-width="7"><path d="M238 270 346 215 462 292 390 411 247 470 354 564"/><circle cx="238" cy="270" r="17" fill="#50f1d2"/><circle cx="346" cy="215" r="14" fill="#50f1d2"/><circle cx="462" cy="292" r="19" fill="#50f1d2"/><circle cx="390" cy="411" r="15" fill="#50f1d2"/><circle cx="247" cy="470" r="18" fill="#50f1d2"/><circle cx="354" cy="564" r="16" fill="#50f1d2"/></g><g stroke="#ff668f" stroke-width="7"><path d="M962 270 854 215 738 292 810 411 953 470 846 564"/><circle cx="962" cy="270" r="17" fill="#ffd166"/><circle cx="854" cy="215" r="14" fill="#ff668f"/><circle cx="738" cy="292" r="19" fill="#ff668f"/><circle cx="810" cy="411" r="25" fill="none" stroke="#ffd166" stroke-width="13"/><circle cx="953" cy="470" r="18" fill="#a98cff"/><circle cx="846" cy="564" r="16" fill="#ff668f"/></g></g>
  <path d="M500 370H700" stroke="#ffd166" stroke-width="14" stroke-linecap="round" filter="url(#g)"/><text x="600" y="346" text-anchor="middle" fill="#ffd166" font-family="system-ui,sans-serif" font-size="18" font-weight="700">CLINICAL CONTEXT</text>
  <g fill="#eef8f6" font-family="system-ui,sans-serif"><text x="350" y="690" text-anchor="middle" font-size="30" font-weight="700">HEALTHY VARIATION</text><text x="850" y="690" text-anchor="middle" font-size="30" font-weight="700">PATHOLOGY PATTERNS</text><text x="600" y="724" text-anchor="middle" font-size="20">A scan informs diagnosis; it does not establish diagnosis alone</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Hypothalamus Atlas</title><desc id="d">Sagittal hypothalamic atlas showing nuclear zones, pituitary connection, optic chiasm and homeostatic pathways.</desc><defs><radialGradient id="bg"><stop stop-color="#1d1828"/><stop offset="1" stop-color="#050607"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="760" rx="34" fill="url(#bg)"/><path d="M130 415C130 190 330 95 545 165c130 42 200 155 165 280-32 112-135 190-275 199-175 12-305-78-305-229Z" fill="none" stroke="#79808d" stroke-width="5" opacity=".55"/><ellipse cx="480" cy="365" rx="115" ry="78" fill="#64748b" opacity=".55"/><path d="M425 428c55-36 125-30 170 10-25 70-65 108-126 105-52-3-74-58-44-115Z" fill="#f97316" filter="url(#glow)"/><path d="M502 535c5 55 0 78-4 110" stroke="#f8fafc" stroke-width="13"/><ellipse cx="498" cy="663" rx="42" ry="25" fill="#fb7185"/><path d="M360 520c55-18 94-10 130 15" stroke="#22d3ee" stroke-width="14" stroke-linecap="round"/><g fill="#fde68a" stroke="#111827" stroke-width="3"><circle cx="455" cy="452" r="24"/><circle cx="520" cy="455" r="24"/><circle cx="565" cy="492" r="22"/><circle cx="470" cy="510" r="22"/></g><g fill="#f8fafc" font-family="Arial,sans-serif"><text x="55" y="75" font-size="44" font-weight="700">HYPOTHALAMUS</text><text x="55" y="112" font-size="20" fill="#fdba74">homeostasis • endocrine • autonomic • circadian</text><text x="320" y="565" font-size="20">optic chiasm</text><text x="535" y="690" font-size="20">pituitary</text><text x="675" y="260" font-size="22">nuclear zones</text><text x="675" y="300" font-size="18" fill="#cbd5e1">preoptic • anterior • tuberal • posterior</text><text x="675" y="360" font-size="22">major outputs</text><text x="675" y="400" font-size="18" fill="#cbd5e1">pituitary • autonomic brainstem • limbic networks</text><text x="55" y="720" font-size="19" fill="#aebac5">Reveal nuclei • trace homeostatic loops • show pituitary pathways • map lesion effects</text></g><g stroke="#f8fafc" stroke-width="2" opacity=".75"><path d="M590 455 665 280"/><path d="M540 560 665 385"/></g></svg>
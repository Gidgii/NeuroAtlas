  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M173 336C121 206 235 86 404 91c82 2 145 39 196 100 51-61 114-98 196-100 169-5 283 115 231 245-22 55-70 91-132 107-41 83-126 124-229 109l-66 81-66-81c-103 15-188-26-229-109-62-16-110-52-132-107Z" fill="#102326" stroke="#50f1d2" stroke-width="8"/>
    <path d="M600 191v337M246 242c74-67 186-83 284-26M670 216c98-57 210-41 284 26M228 329c91-47 201-46 304 1M668 330c103-47 213-48 304-1" stroke="#8cf7e2" stroke-width="5" opacity=".75"/>
    <ellipse cx="510" cy="345" rx="56" ry="38" fill="#ffd166" stroke="#ffe29a" stroke-width="5"/>
    <ellipse cx="690" cy="345" rx="56" ry="38" fill="#ff79c6" stroke="#ffb1dc" stroke-width="5"/>
    <path d="M557 332q43-48 86 0q-43 57-86 0Z" fill="#0b1618" stroke="#69a7ff" stroke-width="5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Integrated whole-brain explorer and capstone</title>
  <desc id="desc">Chalkboard-style bilateral brain with cortex, deep nuclei, ventricles, white-matter pathways, brainstem, cerebellum, vascular territories, functional networks and a lesion marker integrated into one labelled overview.</desc>

    <path d="M250 181c78 29 120 72 149 129M950 181c-78 29-120 72-149 129" stroke="#ff6b6b" stroke-width="12" opacity=".85"/>
    <path d="M337 442c25-105 106-186 209-216M863 442c-25-105-106-186-209-216" stroke="#ffd166" stroke-width="6" stroke-dasharray="10 12"/>
    <circle cx="797" cy="285" r="30" fill="#ff6b6b" opacity=".82" stroke="#fff" stroke-width="4"/>

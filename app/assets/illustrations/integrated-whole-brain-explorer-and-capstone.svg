    <text x="625" y="676" font-size="20" fill="#ffd166">BRAINSTEM + CEREBELLUM</text>
    <text x="827" y="470" font-size="20" fill="#69a7ff">WHITE MATTER</text><text x="932" y="151" font-size="20" fill="#ff6b6b">VASCULAR</text>
    <text x="61" y="520" font-size="20" fill="#ffd166">FUNCTIONAL NETWORK</text><text x="822" y="278" font-size="20" fill="#ff8c8c">LESION</text>
    <text x="457" y="118" font-size="18">LEFT</text><text x="690" y="118" font-size="18">RIGHT</text>

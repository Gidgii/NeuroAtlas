<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Arterial Territories &amp; Stroke Comparison</title><desc id="desc">Interactive chalkboard-style anatomical map of Arterial Territories &amp; Stroke Comparison with selectable regions and pathways.</desc><defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="900" height="600" rx="28" fill="#080b12"/><path d="M95 300 C120 95 340 40 530 95 C730 150 810 300 735 450 C650 570 355 555 170 475 C100 440 70 370 95 300Z" fill="none" stroke="#52606f" stroke-width="4" opacity=".65"/><g fill="none" stroke="#45e6ff" stroke-width="5" stroke-linecap="round" opacity=".85"><path d="M 150 170 C 300 300, 600 300, 450 170" class="path"/><path d="M 450 170 C 300 300, 600 300, 750 170" class="path"/><path d="M 750 170 C 300 300, 600 300, 150 380" class="path"/><path d="M 150 380 C 300 300, 600 300, 450 380" class="path"/><path d="M 450 380 C 300 300, 600 300, 750 380" class="path"/></g><g filter="url(#glow)"><g tabindex="0" role="button" aria-label="anterior cerebral artery territory"><ellipse cx="150" cy="170" rx="105" ry="55" class="node n0"/><text x="150" y="170" text-anchor="middle" class="label">anterior cerebral artery territory</text></g><g tabindex="0" role="button" aria-label="middle cerebral artery territory"><ellipse cx="450" cy="170" rx="105" ry="55" class="node n1"/><text x="450" y="170" text-anchor="middle" class="label">middle cerebral artery territory</text></g><g tabindex="0" role="button" aria-label="posterior cerebral artery territory"><ellipse cx="750" cy="170" rx="105" ry="55" class="node n2"/><text x="750" y="170" text-anchor="middle" class="label">posterior cerebral artery territory</text></g><g tabindex="0" role="button" aria-label="lenticulostriate arteries"><ellipse cx="150" cy="380" rx="105" ry="55" class="node n3"/><text x="150" y="380" text-anchor="middle" class="label">lenticulostriate arteries</text></g><g tabindex="0" role="button" aria-label="anterior choroidal artery"><ellipse cx="450" cy="380" rx="105" ry="55" class="node n4"/><text x="450" y="380" text-anchor="middle" class="label">anterior choroidal artery</text></g><g tabindex="0" role="button" aria-label="posterior inferior cerebellar artery"><ellipse cx="750" cy="380" rx="105" ry="55" class="node n5"/><text x="750" y="380" text-anchor="middle" class="label">posterior inferior cerebellar artery</text></g></g><text x="450" y="535" text-anchor="middle" class="title">Arterial Territories &amp; Stroke Comparison</text><style>.node{fill:#111827;stroke:#ff4fd8;stroke-width:4}.n1,.n4{stroke:#5df2a1}.n2,.n5{stroke:#ffd166}.label{fill:#f8fafc;font:600 18px system-ui}.title{fill:#fff;font:700 28px system-ui}.path{stroke-dasharray:10 9}@media(prefers-reduced-motion:no-preference){.path{animation:dash 7s linear infinite}}@keyframes dash{to{stroke-dashoffset:-180}}</style></svg>
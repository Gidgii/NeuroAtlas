<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">Brainstem Atlas</title><desc id="desc">Interactive chalkboard-style anatomical atlas of Brainstem with labelled regions and pathway relationships.</desc><style>.bg{fill:#090b0d}.outline{fill:#171d24;stroke:#e8f0f4;stroke-width:5}.label{fill:#f5f7f8;font:600 22px Arial}.dot{fill:#48e5c2}.frontal{fill:#ff8a65;opacity:.88}.parietal{fill:#ffd166;opacity:.88}.temporal{fill:#5cc8ff;opacity:.88}.occipital{fill:#b78cff;opacity:.9}.insula{fill:#48e5c2;stroke:#fff;stroke-width:3}.folia path{fill:none;stroke:#5cc8ff;stroke-width:10;stroke-linecap:round}.vermis{fill:#ff8a65;opacity:.8;stroke:#fff;stroke-width:3}.midbrain{fill:#ffd166}.pons{fill:#5cc8ff}.medulla{fill:#ff8a65}.tract{fill:none;stroke:#48e5c2;stroke-width:7;stroke-dasharray:12 8}</style><rect class="bg" width="760" height="480" rx="28"/><text x="40" y="55" class="label">Brainstem Atlas</text><path class="outline" d="M310 88 C267 100 252 148 267 195 L290 248 L280 364 C277 405 312 430 345 408 L368 365 L359 247 L390 194 C414 151 385 96 340 88Z"/><path class="midbrain" d="M270 110 Q330 72 390 112 L370 190 Q330 215 285 190Z"/><path class="pons" d="M285 190 Q330 215 370 190 L374 278 Q330 312 282 278Z"/><path class="medulla" d="M282 278 Q330 310 374 278 L358 382 Q330 420 286 382Z"/><path class="tract" d="M322 104 L320 390 M340 104 L342 390"/><text x="52" y="140" class="label">Midbrain</text><circle cx="30" cy="134" r="7" class="dot"/><text x="52" y="185" class="label">Pons</text><circle cx="30" cy="179" r="7" class="dot"/><text x="52" y="230" class="label">Medulla</text><circle cx="30" cy="224" r="7" class="dot"/><text x="52" y="275" class="label">Reticular formation</text><circle cx="30" cy="269" r="7" class="dot"/><text x="52" y="320" class="label">Long tracts</text><circle cx="30" cy="314" r="7" class="dot"/></svg>
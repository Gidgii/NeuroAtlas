<g font-family="Arial, sans-serif"><text x="760" y="130" fill="#f7fbfa" font-size="48" font-weight="700">Processing Speed</text><text x="760" y="178" fill="#b9c7ca" font-size="23">How efficiently simple cognitive operations are completed</text>
<g font-size="24" fill="#f7fbfa"><circle cx="790" cy="280" r="11" fill="#26e6d4"/><text x="820" y="288">Define processing speed without equating it with intelligence.</text><circle cx="790" cy="380" r="11" fill="#7a7cff"/><text x="820" y="388">Identify non-cognitive contributors to slow scores.</text><circle cx="790" cy="480" r="11" fill="#ff6ca8"/><text x="820" y="488">Explain the speed–accuracy trade-off.</text></g>
<path d="M760 560h330" stroke="#41535a" stroke-width="3"/><text x="760" y="610" fill="#26e6d4" font-size="26" font-weight="700">CLINICAL PEARL</text><text x="760" y="650" fill="#d9e4e6" font-size="20">Slow processing speed often changes how much a person can </text><text x="760" y="680" fill="#d9e4e6" font-size="20">do in time—not what they can understand.</text></g></svg>
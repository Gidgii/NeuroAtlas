name: Atlas QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository and QA dependencies
        run: pip install -e ".[dev,runtime]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Repository validation
        run: |
          python launcher.py validate --no-update-state
          pytest -q
          ruff check .
          ruff format --check .
      - name: Browser runtime QA
        run: python tools/runtime_qa.py --transport http
      - name: Public v1 governance guard
        run: python tools/public_v1_gate.py --ci --write-report PUBLIC_V1_RELEASE_GATE_REPORT.json
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-qa-reports
          path: |
            RUNTIME_QA_REPORT.json
            PUBLIC_V1_RELEASE_GATE_REPORT.json
          if-no-files-found: ignore

[build-system]
requires = ["setuptools>=70", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-neuroscience-atlas"
version = "2.14.0"
description = "Repository tooling and application foundation for the Clinical Neuroscience Atlas PWA."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ashly Peterson" }
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "rich>=13.7,<15.0",
  "typer>=0.12,<1.0",
  "python-dotenv>=1.0,<2.0",
  "orjson>=3.10,<4.0",
  "jsonschema>=4.23,<5.0",
  "packaging>=24.1,<26.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0"
]
runtime = [
  "playwright>=1.54,<2.0"
]

[project.scripts]
clinical-neuroscience-atlas = "launcher:app"

[tool.setuptools]
py-modules = ["launcher", "project_manager", "milestone_manager"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
